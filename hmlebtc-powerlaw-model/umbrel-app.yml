# Umbrel app manifest. Loaded when this repo is added as a Community App
# Store. The directory name and the `id` below must be prefixed with the
# store id from umbrel-app-store.yml (`hmlebtc-powerlaw`).

manifestVersion: 1
id: hmlebtc-powerlaw-model
category: finance
name: BTC Power Law Model
version: "0.1.3"
tagline: Always-current Bitcoin power law model, refit from live data and projected to 2045
icon: https://raw.githubusercontent.com/hmlebtc/umbrel-btc-powerlaw-model/main/assets/icon-512.png
# Umbrel renders the description literally - each paragraph is one physical
# line, blank line between paragraphs. Do not soft-wrap.
description: |
  Bitcoin's price has tracked a power law against its own age since genesis - price = A * t^n, where t is days since the 2009-01-03 genesis block - closely enough that porkopolis.io/thechart and others use it as a long-run valuation reference. This app runs that same regression itself, continuously, on your own Umbrel: no static coefficients are ever baked into the code, every number on the dashboard is recomputed from data at fit time.
  The model refits automatically every 12 hours (configurable) and on demand via a dashboard button with a live progress bar, step label, and ETA. Its input is a daily USD price history amalgamated from multiple free, keyless APIs (blockchain.info, Bitstamp, Binance, Kraken, mempool.space) cross-checked against each other, plus a live spot price - the median of several exchanges - folded in as a provisional point for today until the day's real close is available.
  The chart mirrors porkopolis.io/thechart: an OLS power regression plotted with price and trend on log-log axes, four residual-percentile band pairs - 50% (teal), 67% (blue), 95% (red), and 99% (purple) of history, each toggleable from a legend chip - in either a full-sample or a point-in-time expanding-window mode, halving markers, and a projection out to 2045 with the model author's own stated ~2040 validity horizon called out visually. Readout cards surface fair value, deviation percent, current quantile, the fitted exponent and R², and more, each with a built-in (i) explainer, plus a collapsible "What am I looking at?" panel on the chart itself; a settings drawer, source health chips, and an activity feed round out the dashboard. A high R-squared and a clean-looking chart are not proof of a predictive law - read the README's "Limitations & honest caveats" section before treating any of this as investment advice. Not financial advice.
developer: hmlebtc
website: https://github.com/hmlebtc/umbrel-btc-powerlaw-model
repo: https://github.com/hmlebtc/umbrel-btc-powerlaw-model
support: https://github.com/hmlebtc/umbrel-btc-powerlaw-model/issues
# Host port Umbrel publishes the app on - must be unique across all
# installed apps. The daemon listens on 3013 inside the container
# (docker-compose APP_PORT / BPL_HTTP_PORT); only this host-facing port
# is a distinct number chosen to avoid collisions with other apps.
port: 7913
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: hmlebtc
submission: https://github.com/hmlebtc/umbrel-btc-powerlaw-model
releaseNotes: |
  v0.1.3 - drag-to-pan, holdings valuation, and a reality check on the year-end table.

  Dragging the chart now pans it (hold Shift and drag for the old range-zoom selection); wheel
  zoom and double-click reset are unchanged. The year-end model table gains a "My holdings" mode
  alongside the existing "Price" view - enter one BTC amount that applies to every year, or
  override individual years if you plan to keep accumulating - and every model column (and the
  actual close) switches to showing that holding's value at each line's price instead of the raw
  price itself. Holdings amounts are stored only in the app's own settings.json on your Umbrel,
  behind its login, and are never sent anywhere else; there is deliberately no environment-variable
  seed for them, since they are personal data you enter on the dashboard, not deployment
  configuration. In both table modes, every model column for a year with a known actual close is
  now tinted green where that line sat at or above the actual price and red where it sat below, so
  it's easy to see at a glance which bands actually contained reality. No data or settings
  migration needed; existing installs pick this up on their next update.

  v0.1.2 - individual percentile lines and a year-end table.

  The band fan moves from four fixed pairs to eleven individually labeled, individually
  toggleable percentile lines - 2.5%, 16.5%, 83.5%, and 97.5% shown by default, with a
  "More bands" legend expander adding 0.5%, 10%, 25%, the 50% median, 75%, 90%, and 99.5%. A new
  collapsible "Year-end model table" lists every calendar year's actual close next to the fitted
  trend and default bands, out to whatever projection year is configured. The main chart is
  bigger by default on wide screens, and the band-mode explainer now spells out in plain English
  why full-sample paints a wider, more optimistic funnel and point-in-time a narrower, more
  conservative one. No data or settings migration needed; existing installs pick this up on their
  next update.

  v0.1.1 - explainer tooltips and a richer band fan.

  Every readout tile and settings field now has a small (i) button explaining what it means and
  where the number comes from, and the chart gets a collapsible "What am I looking at?" panel
  covering the same ground for the whole picture. The percentile bands go from two pairs to four -
  50% (teal), 67% (blue), 95% (red), and 99% (purple) - with a click-to-toggle legend so you can
  hide the pairs you don't want cluttering the view. No data or settings migration needed; existing
  installs pick this up on their next update.

  v0.1.0 - first release.

  A continuously self-refitting Bitcoin power-law dashboard: full daily USD history amalgamated
  from multiple free keyless APIs, a live median spot price folded in as a provisional point for
  today, an OLS power-law fit (price = A * t^n) recomputed on a configurable cadence and on
  demand, and a porkopolis.io/thechart-style chart with residual-percentile bands, halving
  markers, and a projection to 2045. No static model coefficients anywhere in the code - every
  number shown is derived from data at fit time. Settings drawer, source health chips, activity
  feed, and a job progress UI for manual refits.
